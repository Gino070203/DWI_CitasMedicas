<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario - Centro Médico</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; font-size: 13px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Registro de Paciente</h2>
    
    <!-- Mensaje de error si el correo ya existe -->
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/registrar}" th:object="${usuario}" method="POST">
        <div class="form-group">
            <label>DNI:</label>
            <input type="text" th:field="*{dni}" required />
        </div>
        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" th:field="*{nombre}" required />
        </div>
        <div class="form-group">
            <label>Apellido:</label>
            <input type="text" th:field="*{apellido}" required />
        </div>
        <div class="form-group">
            <label>Correo Electrónico:</label>
            <input type="email" th:field="*{correo}" required />
        </div>
        <div class="form-group">
            <label>Teléfono:</label>
            <input type="text" th:field="*{telefono}" />
        </div>
        <div class="form-group">
            <label>Dirección:</label>
            <input type="text" th:field="*{direccion}" />
        </div>
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" th:field="*{contraseña}" required />
        </div>
        
        <button type="submit">Registrarse y Enviar Código</button>
    </form>
</div>

</body>
</html>
