<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de especialidad</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3>Registrar / Editar especialidad</h3>

            <div th:if="${error}" class="alert alert-danger"
                 th:text="${error}"></div>

            <form method="post"
                  th:action="@{/admin/especialidades/guardar}">

                <input type="hidden" name="idEspecialidad"
                       th:value="${especialidad.idEspecialidad}">

                <label class="form-label mt-3">Nombre</label>
                <input name="nombre" class="form-control"
                       th:value="${especialidad.nombre}"
                       maxlength="100" required>

                <label class="form-label mt-3">Descripción</label>
                <textarea name="descripcion" class="form-control"
                          maxlength="200" rows="4"
                          th:text="${especialidad.descripcion}"></textarea>

                <button class="btn btn-success mt-4">
                    Guardar
                </button>

                <a class="btn btn-secondary mt-4"
                   th:href="@{/admin/especialidades}">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
