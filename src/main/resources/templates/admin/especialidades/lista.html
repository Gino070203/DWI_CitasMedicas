<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Especialidades</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2>Gestión de especialidades</h2>

    <div th:if="${mensaje}" class="alert alert-success"
         th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}"></div>

    <a class="btn btn-primary mb-3"
       th:href="@{/admin/especialidades/nuevo}">
        Nueva especialidad
    </a>

    <table class="table table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${especialidades}">
            <td th:text="${e.idEspecialidad}"></td>
            <td th:text="${e.nombre}"></td>
            <td th:text="${e.descripcion}"></td>
            <td th:text="${e.estado ? 'Activo' : 'Inactivo'}"></td>
            <td>
                <a class="btn btn-warning btn-sm"
                   th:href="@{/admin/especialidades/editar/{id}(id=${e.idEspecialidad})}">
                    Editar
                </a>
                <form method="post" class="d-inline"
                      th:action="@{/admin/especialidades/estado/{id}(id=${e.idEspecialidad})}">
                    <button class="btn btn-secondary btn-sm">
                        Cambiar estado
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/admin/dashboard}"
       class="btn btn-outline-dark">Volver</a>
</div>
</body>
</html>
