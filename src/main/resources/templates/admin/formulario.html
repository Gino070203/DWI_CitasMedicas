<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de usuario</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3>Registrar / Editar usuario</h3>

            <div th:if="${error}" class="alert alert-danger"
                 th:text="${error}"></div>

            <form method="post" th:action="@{/admin/usuarios/guardar}">
                <input type="hidden" name="idUsuario"
                       th:value="${usuario.idUsuario}">

                <label class="form-label mt-3">Nombre</label>
                <input name="nombre" class="form-control" required
                       th:value="${usuario.nombre}" maxlength="255">

                <label class="form-label mt-3">Apellido</label>
                <input name="apellido" class="form-control" required
                       th:value="${usuario.apellido}" maxlength="255">

                <label class="form-label mt-3">DNI</label>
                <input name="dni" class="form-control" required
                       maxlength="8" pattern="[0-9]{8}"
                       th:value="${usuario.dni}">

                <label class="form-label mt-3">Correo</label>
                <input type="email" name="correo"
                       class="form-control" required
                       th:value="${usuario.correo}">

                <label class="form-label mt-3">Teléfono</label>
                <input name="telefono" class="form-control"
                       th:value="${usuario.telefono}">

                <label class="form-label mt-3">Dirección</label>
                <input name="direccion" class="form-control"
                       th:value="${usuario.direccion}">

                <label class="form-label mt-3">Rol</label>
                <select name="rol" class="form-select" required>
                    <option value="ADMIN"
                            th:selected="${usuario.rol != null and usuario.rol.nombre == 'ADMIN'}">
                        Administrador
                    </option>
                    <option value="MEDICO"
                            th:selected="${usuario.rol != null and usuario.rol.nombre == 'MEDICO'}">
                        Médico
                    </option>
                    <option value="PACIENTE"
                            th:selected="${usuario.rol != null and usuario.rol.nombre == 'PACIENTE'}">
                        Paciente
                    </option>
                </select>

                <label class="form-label mt-3">
                    Contraseña (vacía para conservar la actual)
                </label>
                <input type="password" name="password"
                       class="form-control" autocomplete="new-password">

                <button class="btn btn-success mt-4">Guardar</button>
                <a class="btn btn-secondary mt-4"
                   th:href="@{/admin/usuarios}">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
