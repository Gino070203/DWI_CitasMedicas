<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrar usuarios</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2>Gestión de usuarios</h2>

    <div th:if="${mensaje}" class="alert alert-success"
         th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}"></div>

    <a class="btn btn-primary mb-3"
       th:href="@{/admin/usuarios/nuevo}">Nuevo usuario</a>

    <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white">
            <thead class="table-dark">
            <tr>
                <th>ID</th><th>Nombre</th><th>DNI</th>
                <th>Correo</th><th>Rol</th><th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.idUsuario}"></td>
                <td th:text="${u.nombre + ' ' + u.apellido}"></td>
                <td th:text="${u.dni}"></td>
                <td th:text="${u.correo}"></td>
                <td th:text="${u.rol.nombre}"></td>
                <td th:text="${u.estado ? 'Activo' : 'Inactivo'}"></td>
                <td>
                    <a class="btn btn-warning btn-sm"
                       th:href="@{/admin/usuarios/editar/{id}(id=${u.idUsuario})}">
                        Editar
                    </a>
                    <form method="post" class="d-inline"
                          th:action="@{/admin/usuarios/estado/{id}(id=${u.idUsuario})}">
                        <button class="btn btn-secondary btn-sm">
                            Cambiar estado
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/admin/dashboard}"
       class="btn btn-outline-dark">Volver</a>
</div>
</body>
</html>
