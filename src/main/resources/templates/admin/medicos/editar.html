<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3>Editar Médico</h3>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <p>
                Médico:
                <strong th:text="${medico.usuario.nombre + ' ' + medico.usuario.apellido}"></strong>
            </p>

            <form method="post"
                  th:action="@{/admin/medicos/actualizar/{id}(id=${medico.idMedico})}">

                <label class="form-label">CMP</label>
                <input name="cmp" class="form-control"
                       th:value="${medico.cmp}" maxlength="20" required>

                <label class="form-label mt-3">Especialidad</label>
                <select name="idEspecialidad" class="form-select" required>
                    <option th:each="e : ${especialidades}"
                            th:value="${e.idEspecialidad}"
                            th:text="${e.nombre}"
                            th:selected="${e.idEspecialidad == medico.especialidad.idEspecialidad}">
                    </option>
                </select>

                <button class="btn btn-success mt-4">Actualizar</button>
                <a th:href="@{/admin/medicos}" class="btn btn-secondary mt-4">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
