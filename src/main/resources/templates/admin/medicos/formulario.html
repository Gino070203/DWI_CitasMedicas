<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3>Registrar Médico</h3>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/admin/medicos/guardar}" method="post">
                <label class="form-label mt-3">Usuario médico</label>
                <select name="idUsuario" class="form-select" required>
                    <option value="">Seleccione un usuario</option>
                    <option th:each="u : ${usuarios}"
                            th:value="${u.idUsuario}"
                            th:text="${u.nombre + ' ' + u.apellido + ' - ' + u.dni}">
                    </option>
                </select>

                <label class="form-label mt-3">CMP</label>
                <input type="text" name="cmp" class="form-control"
                       maxlength="20" required>

                <label class="form-label mt-3">Especialidad</label>
                <select name="idEspecialidad" class="form-select" required>
                    <option value="">Seleccione una especialidad</option>
                    <option th:each="e : ${especialidades}"
                            th:value="${e.idEspecialidad}"
                            th:text="${e.nombre}">
                    </option>
                </select>

                <button type="submit" class="btn btn-success mt-4">Guardar médico</button>
                <a th:href="@{/admin/medicos}" class="btn btn-secondary mt-4">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
