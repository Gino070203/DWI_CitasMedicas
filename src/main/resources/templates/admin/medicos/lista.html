<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Médicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2>Gestión de Médicos</h2>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex gap-2 mb-3">
        <a th:href="@{/admin/medicos/nuevo}" class="btn btn-primary">Nuevo médico</a>
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Volver</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Médico</th>
                <th>CMP</th>
                <th>Especialidad</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${medicos}">
                <td th:text="${m.idMedico}"></td>
                <td th:text="${m.usuario.nombre + ' ' + m.usuario.apellido}"></td>
                <td th:text="${m.cmp}"></td>
                <td th:text="${m.especialidad.nombre}"></td>
                <td th:text="${m.estado ? 'Activo' : 'Inactivo'}"></td>
                <td>
                    <a class="btn btn-warning btn-sm"
                       th:href="@{/admin/medicos/editar/{id}(id=${m.idMedico})}">Editar</a>

                    <form method="post" class="d-inline"
                          th:action="@{/admin/medicos/estado/{id}(id=${m.idMedico})}">
                        <button class="btn btn-secondary btn-sm">Cambiar estado</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(medicos)}">
                <td colspan="6" class="text-center">No hay médicos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
