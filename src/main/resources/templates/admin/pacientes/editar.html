<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3>Editar Paciente</h3>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <p>
                Paciente:
                <strong th:text="${paciente.usuario.nombre + ' ' + paciente.usuario.apellido}"></strong>
            </p>

            <form method="post"
                  th:action="@{/admin/pacientes/actualizar/{id}(id=${paciente.idPaciente})}">

                <label class="form-label mt-3">Historia clínica</label>
                <input name="numeroHistoria" class="form-control"
                       th:value="${paciente.numeroHistoria}" maxlength="20" required>

                <label class="form-label mt-3">SIS</label>
                <input name="sis" class="form-control"
                       th:value="${paciente.sis}" maxlength="20">

                <label class="form-label mt-3">Fecha de nacimiento</label>
                <input type="date" name="fechaNacimiento"
                       class="form-control"
                       th:value="${paciente.fechaNacimiento}" required>

                <label class="form-label mt-3">Género</label>
                <select name="genero" class="form-select" required>
                    <option value="MASCULINO"
                            th:selected="${paciente.genero == 'MASCULINO'}">Masculino</option>
                    <option value="FEMENINO"
                            th:selected="${paciente.genero == 'FEMENINO'}">Femenino</option>
                    <option value="OTRO"
                            th:selected="${paciente.genero == 'OTRO'}">Otro</option>
                </select>

                <label class="form-label mt-3">Dirección</label>
                <input name="direccion" class="form-control"
                       th:value="${paciente.direccion}" maxlength="100">

                <button class="btn btn-success mt-4">Actualizar</button>
                <a th:href="@{/admin/pacientes}" class="btn btn-secondary mt-4">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
