<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2>Gestión de Pacientes</h2>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex gap-2 mb-3">
        <a th:href="@{/admin/pacientes/nuevo}" class="btn btn-primary">Nuevo paciente</a>
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Volver</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered bg-white">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Paciente</th>
                <th>DNI</th>
                <th>Historia clínica</th>
                <th>SIS</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pacientes}">
                <td th:text="${p.idPaciente}"></td>
                <td th:text="${p.usuario.nombre + ' ' + p.usuario.apellido}"></td>
                <td th:text="${p.usuario.dni}"></td>
                <td th:text="${p.numeroHistoria}"></td>
                <td th:text="${p.sis}"></td>
                <td th:text="${p.estado ? 'Activo' : 'Inactivo'}"></td>
                <td>
                    <a class="btn btn-warning btn-sm"
                       th:href="@{/admin/pacientes/editar/{id}(id=${p.idPaciente})}">
                        Editar
                    </a>
                    <form method="post" class="d-inline"
                          th:action="@{/admin/pacientes/estado/{id}(id=${p.idPaciente})}">
                        <button class="btn btn-secondary btn-sm">Cambiar estado</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pacientes)}">
                <td colspan="7" class="text-center">No hay pacientes registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
