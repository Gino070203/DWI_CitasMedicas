
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario de Usuarios | Citas Médicas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f3f6fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: linear-gradient(90deg, #123b70, #1767b2);
        }

        .form-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(90deg, #163e70, #2477c4);
            color: white;
            padding: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
            padding: 11px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #2477c4;
            box-shadow: 0 0 0 0.2rem rgba(36,119,196,0.15);
        }
    </style>
</head>

<body>

    <!-- BARRA SUPERIOR -->
    <nav class="navbar navbar-dark shadow-sm">
        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold"
               th:href="@{/admin/dashboard}">

                <i class="bi bi-hospital me-2"></i>
                Centro Médico Buenos Aires de Villa

            </a>

        </div>
    </nav>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-9">

                <div class="card form-card shadow-sm">

                    <!-- ENCABEZADO -->
                    <div class="form-header">

                        <h3 class="mb-2">

                            <i class="bi bi-person-gear me-2"></i>

                            <span th:text="${usuario.idUsuario == null} ? 'Registrar nuevo usuario' : 'Editar usuario'">
                                Registrar usuario
                            </span>

                        </h3>

                        <p class="mb-0">
                            Completa los datos personales y asigna
                            un rol dentro del sistema.
                        </p>

                    </div>

                    <div class="card-body p-4 p-md-5">

                        <!-- MENSAJE DE ERROR -->
                        <div th:if="${error}"
                             class="alert alert-danger"
                             th:text="${error}">
                        </div>

                        <form method="post"
                              th:action="@{/admin/usuarios/guardar}">

                            <!-- ID OCULTO -->
                            <input type="hidden"
                                   name="idUsuario"
                                   th:value="${usuario.idUsuario}">

                            <h5 class="fw-bold text-primary mb-3">
                                <i class="bi bi-person-vcard me-2"></i>
                                Información personal
                            </h5>

                            <div class="row g-3">

                                <!-- NOMBRE -->
                                <div class="col-md-6">

                                    <label class="form-label">
                                        Nombre
                                    </label>

                                    <input type="text"
                                           name="nombre"
                                           class="form-control"
                                           placeholder="Ingrese el nombre"
                                           th:value="${usuario.nombre}"
                                           maxlength="100"
                                           required>

                                </div>

                                <!-- APELLIDO -->
                                <div class="col-md-6">

                                    <label class="form-label">
                                        Apellido
                                    </label>

                                    <input type="text"
                                           name="apellido"
                                           class="form-control"
                                           placeholder="Ingrese el apellido"
                                           th:value="${usuario.apellido}"
                                           maxlength="100"
                                           required>

                                </div>

                                <!-- DNI -->
                                <div class="col-md-6">

                                    <label class="form-label">
                                        DNI
                                    </label>

                                    <input type="text"
                                           name="dni"
                                           class="form-control"
                                           placeholder="8 dígitos"
                                           th:value="${usuario.dni}"
                                           pattern="[0-9]{8}"
                                           minlength="8"
                                           maxlength="8"
                                           inputmode="numeric"
                                           required>

                                </div>

                                <!-- TELÉFONO -->
                                <div class="col-md-6">

                                    <label class="form-label">
                                        Teléfono
                                    </label>

                                    <input type="tel"
                                           name="telefono"
                                           class="form-control"
                                           placeholder="Número telefónico"
                                           th:value="${usuario.telefono}"
                                           maxlength="20">

                                </div>

                                <!-- DIRECCIÓN -->
                                <div class="col-12">

                                    <label class="form-label">
                                        Dirección
                                    </label>

                                    <input type="text"
                                           name="direccion"
                                           class="form-control"
                                           placeholder="Ingrese la dirección"
                                           th:value="${usuario.direccion}"
                                           maxlength="200">

                                </div>

                            </div>

                            <hr class="my-4">

                            <h5 class="fw-bold text-primary mb-3">
                                <i class="bi bi-shield-lock me-2"></i>
                                Datos de acceso
                            </h5>

                            <div class="row g-3">

                                <!-- CORREO -->
                                <div class="col-md-6">

                                    <label class="form-label">
                                        Correo electrónico
                                    </label>

                                    <input type="email"
                                           name="correo"
                                           class="form-control"
                                           placeholder="ejemplo@correo.com"
                                           th:value="${usuario.correo}"
                                           maxlength="100"
                                           required>

                                </div>

                                <!-- ROL -->
                                <div class="col-md-6">

                                    <label class="form-label">
                                        Rol del usuario
                                    </label>

                                    <select name="rol"
                                            class="form-select"
                                            required>

                                        <option value="ADMIN"
                                                th:selected="${usuario.rol != null and usuario.rol.nombre == 'ADMIN'}">
                                            Administrador
                                        </option>

                                        <option value="MEDICO"
                                                th:selected="${usuario.rol != null and usuario.rol.nombre == 'MEDICO'}">
                                            Médico
                                        </option>

                                        <option value="PACIENTE"
                                                th:selected="${usuario.rol != null and usuario.rol.nombre == 'PACIENTE'}">
                                            Paciente
                                        </option>

                                    </select>

                                </div>

                                <!-- CONTRASEÑA -->
                                <div class="col-12">

                                    <label class="form-label">
                                        Contraseña
                                    </label>

                                    <div class="input-group">

                                        <input type="password"
                                               name="password"
                                               id="password"
                                               class="form-control"
                                               placeholder="Ingrese la contraseña"
                                               minlength="8"
                                               autocomplete="new-password"
                                               th:required="${usuario.idUsuario == null}">

                                        <button class="btn btn-outline-secondary"
                                                type="button"
                                                id="togglePassword"
                                                aria-label="Mostrar u ocultar contraseña">

                                            <i class="bi bi-eye"></i>

                                        </button>

                                    </div>

                                    <small class="text-muted"
                                           th:if="${usuario.idUsuario != null}">
                                        Deja este campo vacío si no deseas
                                        modificar la contraseña actual.
                                    </small>

                                    <small class="text-muted"
                                           th:if="${usuario.idUsuario == null}">
                                        Mínimo 8 caracteres.
                                    </small>

                                </div>

                            </div>

                            <!-- BOTONES -->
                            <div class="d-flex flex-wrap gap-2 mt-4">

                                <button type="submit"
                                        class="btn btn-success px-4">

                                    <i class="bi bi-floppy me-1"></i>

                                    <span th:text="${usuario.idUsuario == null} ? 'Registrar usuario' : 'Guardar cambios'">
                                        Guardar
                                    </span>

                                </button>

                                <a th:href="@{/admin/usuarios}"
                                   class="btn btn-outline-secondary px-4">

                                    <i class="bi bi-x-circle me-1"></i>
                                    Cancelar

                                </a>

                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <script>
        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");

        togglePassword.addEventListener("click", function () {
            const visible = passwordInput.type === "text";

            passwordInput.type = visible ? "password" : "text";

            togglePassword.innerHTML = visible
                ? '<i class="bi bi-eye"></i>'
                : '<i class="bi bi-eye-slash"></i>';
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
