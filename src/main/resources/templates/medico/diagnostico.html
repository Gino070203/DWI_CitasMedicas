<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar diagnóstico | Centro Médico Buenos Aires de Villa</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #0b1f36;
            --primary-blue: #123b70;
            --accent-blue: #1767b2;
            --bg-body: #f8fafc;
        }

        body {
            background-color: var(--bg-body);
            font-family: Arial, sans-serif;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        /* --- TOPBAR --- */
        .topbar {
            background: linear-gradient(135deg, #0b2545 0%, #134074 100%);
            color: white;
            padding: 15px 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .topbar h1 {
            font-size: 16px;
            font-weight: bold;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar form button {
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .topbar form button:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .contenedor {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex-grow: 1;
        }

        /* --- FORMULARIO / TARJETA --- */
        .formulario-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .cabecera {
            border-bottom: 1px solid #e2e8f0;
            padding: 25px 35px;
            background-color: #ffffff;
        }

        .cabecera h2 {
            font-size: 22px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .cabecera p {
            font-size: 13px;
            color: #64748b;
            margin: 0;
        }

        .cuerpo {
            padding: 35px;
        }

        /* --- AVISO ERROR --- */
        .aviso {
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .aviso.err { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        /* --- DATOS DEL PACIENTE --- */
        .datos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo span {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .campo strong {
            font-size: 14px;
            color: #1e293b;
        }

        /* --- CAMPOS DE FORMULARIO --- */
        label {
            font-size: 13px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 8px;
            display: block;
        }

        textarea {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 13px;
            background-color: #f8fafc;
            color: #1e293b;
            resize: vertical;
            transition: all 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(23, 103, 178, 0.1);
            background-color: #fff;
        }

        /* --- ACCIONES --- */
        .acciones {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-verde {
            background-color: #16a34a;
            color: white;
        }
        .btn-verde:hover {
            background-color: #15803d;
            color: white;
        }

        .btn-borde {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
        }
        .btn-borde:hover {
            background-color: #f1f5f9;
            color: #1e293b;
        }

        /* --- PIE --- */
        .pie {
            text-align: center;
            padding: 25px;
            color: #94a3b8;
            font-size: 12px;
            border-top: 1px solid #e2e8f0;
            background-color: white;
        }
    </style>
</head>
<body>

<!-- BARRA SUPERIOR -->
<div class="topbar">
    <h1>
        <i class="bi bi-hospital"></i>
        Centro Médico Buenos Aires de Villa
    </h1>
    <form th:action="@{/logout}" method="post" class="m-0">
        <button type="submit">
            <i class="bi bi-box-arrow-right"></i> Cerrar sesión
        </button>
    </form>
</div>

<div class="contenedor">
    <div class="formulario-card">

        <!-- CABECERA -->
        <div class="cabecera">
            <h2>Registrar diagnóstico</h2>
            <p>Anota el diagnóstico y las indicaciones clínicas para el paciente.</p>
        </div>

        <!-- CUERPO -->
        <div class="cuerpo">
            <div class="aviso err" th:if="${error}" th:text="${error}"></div>

            <!-- RESUMEN DE DATOS DEL PACIENTE -->
            <div class="datos">
                <div class="campo">
                    <span>Paciente</span>
                    <strong th:text="${cita.paciente.usuario.nombre + ' ' + cita.paciente.usuario.apellido}"></strong>
                </div>
                <div class="campo">
                    <span>DNI</span>
                    <strong th:text="${cita.paciente.usuario.dni}"></strong>
                </div>
                <div class="campo">
                    <span>Fecha y hora</span>
                    <strong th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy') + ' · ' + cita.horaInicio + ' - ' + cita.horaFin}"></strong>
                </div>
                <div class="campo">
                    <span>Estado</span>
                    <strong th:text="${cita.estado}"></strong>
                </div>
            </div>

            <!-- FORMULARIO -->
            <form th:action="@{/medico/citas/{id}/diagnostico(id=${cita.idCita})}" method="post">
                <label for="diagnostico">Diagnóstico e indicaciones (máximo 500 caracteres)</label>
                <textarea id="diagnostico" name="diagnostico" rows="7" maxlength="500" required
                          th:text="${cita.diagnostico}" placeholder="Escribe aquí las observaciones clínicas, medicamentos o indicaciones..."></textarea>

                <div class="acciones">
                    <a class="btn btn-borde" th:href="@{/medico/dashboard}">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                    <button type="submit" class="btn btn-verde">
                        <i class="bi bi-check-circle"></i> Guardar y marcar como atendida
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- PIE DE PÁGINA -->
<div class="pie">
    © 2026 Centro Médico Buenos Aires de Villa | Sistema de Gestión de Citas Médicas
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
